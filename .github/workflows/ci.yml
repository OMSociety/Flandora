name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连推两次时，前一次的结论对后一次没有意义，直接取消省机器
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 输出里全是中文：统一 UTF-8，避免 Windows 代码页把日志变成乱码或直接编码失败
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  python:
    name: Python 3.13 (compileall · ruff · pytest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            flandora/requirements.txt
            manager/requirements.txt
            requirements-dev.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: 版本号单一来源
        # 只认 flandora/__init__.py 的 __version__；别处再写死一份就红
        run: python tools/sync_version.py --check
      - name: 依赖漏洞扫描
        # 只查运行期清单；requirements 带中文注释，靠上面的 PYTHONUTF8 才能被解析器正确读取
        run: python -m pip_audit -r flandora/requirements.txt --progress-spinner off
      - name: 语法编译检查
        run: python -m compileall -q flandora manager sdk mcp tools
      - name: Lint
        run: python -m ruff check .
      - name: 格式检查
        run: python -m ruff format --check .
      - name: 配置示例与字段说明一致
        # config.example.json 是生成物：改了 fields.py 的字段或 desc 却没重跑生成脚本就红
        run: python tools/gen_config_example.py --check
      - name: SDK 动作快照与目录一致
        run: |
          python tools/gen_sdk_catalog.py
          git diff --exit-code -- sdk/python/flandora_sdk/_catalog.json
          git diff --exit-code -- mcp/python/flandora_mcp/_catalog.json
      - name: 安装 SDK 并做导入冒烟
        run: |
          python -m pip install -e sdk/python
          python -c "import flandora_sdk; print(flandora_sdk.__version__, len(flandora_sdk.list_actions()))"

      - name: 安装 MCP 服务并自检
        run: |
          python -m pip install -e mcp/python
          python -m flandora_mcp.server --selftest
      - name: 单元测试
        # -rs 把每个跳过用例的名字与原因打进报告：本机没有微信时 test_wx_desktop
        # 会 skip，静默跳过会让「跳过」被当成「通过」
        run: python -m pytest tests -q -rs
      - name: 每个测试文件都要被 pytest 收集到用例
        # 挡的是「文件名叫 test_*.py 但只有 main() 脚本式断言」：pytest 收到 0 个
        # 用例却不报错，整套断言会在 CI 里静默跳过。见 tools/check_test_collection.py。
        run: python tools/check_test_collection.py

  package:
    name: 打包冒烟（build.py · 载荷清单）
    runs-on: windows-latest
    # PyInstaller 要打四个 exe（含 frida），本机 8 分钟起步；CI 机器更慢，给足余量
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            flandora/requirements.txt
            manager/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui-frontend/package-lock.json
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: 构建前端
        working-directory: webui-frontend
        run: |
          npm ci
          npm run build
      - name: 打包前校验
        # 版本号、载荷目录、--add-data 清单、前端产物是否比源码旧
        run: python build.py --check
      - name: 打包（复用刚构建的前端产物）
        run: python build.py --skip-web
      - name: 载荷清单断言
        shell: pwsh
        run: |
          $payload = Get-ChildItem dist -Directory -Filter 'Flandora-v*' | Select-Object -First 1
          if ($null -eq $payload) { Write-Error '没有生成 dist/Flandora-v* 载荷目录'; exit 1 }
          $required = @(
            'Flandora.exe',
            'Flandora-Manager.exe',
            'Flandora-LogTail.exe',
            'Flandora-KeyTool.exe',
            '启动.bat',
            'README.md',
            'LICENSE',
            'docs'
          )
          $missing = @()
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $payload.FullName $item))) { $missing += $item }
          }
          if ($missing.Count -gt 0) { Write-Error ("载荷缺少：" + ($missing -join '、')); exit 1 }
          $zip = Get-ChildItem dist -Filter 'Flandora-v*.zip' | Select-Object -First 1
          if ($null -eq $zip) { Write-Error '没有生成 portable zip'; exit 1 }
          Write-Host ("载荷清单通过：" + $payload.Name + "，" + $zip.Name + " " + [math]::Round($zip.Length / 1MB, 2) + " MB")

  frontend:
    name: WebUI 控制台（build · playwright）
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webui-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui-frontend/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - name: 安装浏览器
        run: npx playwright install chromium
      - name: 控制台冒烟测试
        run: npm test
