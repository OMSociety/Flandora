<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Flandora 运行链路</title>
  <desc id="map-desc">微信 PC 客户端与本机数据库构成收件侧，隔离桌面与 UI 自动化构成发送侧；两侧在 Flandora 内合流，对外只暴露 OneBot v11 的入口（WS 服务端、HTTP 服务端、反向 WS、HTTP 上报）与面板。</desc>

  <defs>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8ea99b"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#8ea99b"/>
    </marker>
    <linearGradient id="map-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07c160"/>
      <stop offset="1" stop-color="#8ceab8"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#f7faf8"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="27.25" fill="none" stroke="#dbe6de" stroke-width="1.5"/>

  <g class="mono" fill="#6f8b7c" font-size="12" letter-spacing="2.4">
    <text x="54" y="56">RUNTIME MAP · FROM WECHAT TO ONEBOT</text>
  </g>
  <text class="sans" x="54" y="100" fill="#16211b" font-size="32" font-weight="700">一条消息如何穿过 Flandora</text>
  <text class="sans" x="54" y="130" fill="#5c6f64" font-size="15">收件与发送两条链路彼此独立，对外只暴露 OneBot v11 事件与动作。</text>
  <rect x="54" y="146" width="96" height="3" rx="1.5" fill="url(#map-rule)"/>

  <rect x="54" y="176" width="210" height="176" rx="18" fill="#ffffff" stroke="#d7e3db"/>
  <text class="sans" x="74" y="212" fill="#16211b" font-size="17" font-weight="600">微信 PC 客户端</text>
  <g class="sans" fill="#5c6f64" font-size="13.5">
    <text x="74" y="244">本机 SQLCipher 库</text>
    <text x="74" y="270">真实窗口与输入框</text>
    <text x="74" y="296">单实例，需登录</text>
  </g>
  <text class="mono" x="74" y="330" fill="#9db3a6" font-size="11" letter-spacing="1.2">WECHAT 4.x</text>

  <rect x="330" y="150" width="430" height="232" rx="20" fill="#ffffff" stroke="#07c160" stroke-width="1.5"/>
  <text class="sans" x="352" y="188" fill="#16211b" font-size="22" font-weight="700">Flandora</text>
  <text class="mono" x="738" y="188" fill="#9db3a6" font-size="11" letter-spacing="1.4" text-anchor="end">BRIDGE</text>

  <g class="sans" font-size="13.5">
    <rect x="352" y="204" width="386" height="46" rx="12" fill="#f2f7f4" stroke="#e2ece6"/>
    <circle cx="373" cy="227" r="4" fill="#07c160"/>
    <text x="388" y="232" fill="#16211b" font-weight="600">取钥</text>
    <text x="426" y="232" fill="#5c6f64">登录瞬间截获口令，DPAPI 加密落盘</text>

    <rect x="352" y="258" width="386" height="46" rx="12" fill="#f2f7f4" stroke="#e2ece6"/>
    <circle cx="373" cy="281" r="4" fill="#07c160"/>
    <text x="388" y="286" fill="#16211b" font-weight="600">收件</text>
    <text x="426" y="286" fill="#5c6f64">解密副本只读轮询，组装 OneBot 事件</text>

    <rect x="352" y="312" width="386" height="46" rx="12" fill="#f2f7f4" stroke="#e2ece6"/>
    <circle cx="373" cy="335" r="4" fill="#07c160"/>
    <text x="388" y="340" fill="#16211b" font-weight="600">发送</text>
    <text x="426" y="340" fill="#5c6f64">UI 自动化投递，默认在隔离桌面上</text>
  </g>

  <text class="mono" x="352" y="374" fill="#9db3a6" font-size="11" letter-spacing="1.2">CONTROL PANEL · http://127.0.0.1:4950</text>

  <rect x="846" y="176" width="300" height="176" rx="18" fill="#ffffff" stroke="#d7e3db"/>
  <text class="sans" x="866" y="212" fill="#16211b" font-size="17" font-weight="600">OneBot v11 客户端</text>
  <g class="sans" fill="#5c6f64" font-size="13.5">
    <text x="866" y="244">任意 OneBot v11 实现</text>
    <text x="866" y="270">回复策略与上下文在客户端侧</text>
    <text x="866" y="296">群消息全量上报</text>
  </g>
  <text class="mono" x="866" y="330" fill="#9db3a6" font-size="11" letter-spacing="1.2">WS · 127.0.0.1:7999</text>

  <g stroke="#8ea99b" stroke-width="1.5">
    <line x1="266" y1="231" x2="326" y2="231" marker-end="url(#arrow-right)"/>
    <line x1="326" y1="293" x2="266" y2="293" marker-end="url(#arrow-left)"/>
    <line x1="762" y1="231" x2="842" y2="231" marker-end="url(#arrow-right)"/>
    <line x1="842" y1="293" x2="762" y2="293" marker-end="url(#arrow-left)"/>
  </g>
  <g class="mono" fill="#7f9a8c" font-size="10" letter-spacing="1.2" text-anchor="middle">
    <text x="296" y="222">收件</text>
    <text x="296" y="308">发送</text>
    <text x="802" y="222">事件</text>
    <text x="802" y="308">动作</text>
  </g>
</svg>
