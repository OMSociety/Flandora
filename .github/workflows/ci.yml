name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python 3.13 (compileall · ruff · pytest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            flandora/requirements.txt
            manager/requirements.txt
            requirements-dev.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: 语法编译检查
        run: python -m compileall -q flandora manager
      - name: Lint
        run: python -m ruff check .
      - name: 格式检查
        run: python -m ruff format --check .
      - name: 单元测试
        run: python -m pytest tests -q

  frontend:
    name: WebUI 控制台（build · playwright）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: webui-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui-frontend/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - name: 安装浏览器
        run: npx playwright install chromium
      - name: 控制台冒烟测试
        run: npm test
